name: CI

# Integración continua del backend: compila, ejecuta las pruebas unitarias y las de
# integración (contra PostgreSQL real) y verifica que la imagen Docker se construya.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL real para las pruebas de integración (CitasPostgresIT, perfil "it").
    # Los valores coinciden con los de src/test/resources/application-it.properties.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: piedrazul_it
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piedrazul_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # verify = compilar + pruebas unitarias (surefire) + pruebas de integración (failsafe)
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # Solo comprueba que el Dockerfile construya; no publica la imagen
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
