jwt.secret=${JWT_SECRET}
spring.datasource.url=jdbc:sqlite:piedrazul.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.agendador.email=${AGENDADOR_EMAIL}
app.agendador.password=${AGENDADOR_PASSWORD}
app.keycloak.jwks-url=${KEYCLOAK_JWKS_URL:http://localhost:8180/realms/piedrazul/protocol/openid-connect/certs}
app.keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/piedrazul}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}