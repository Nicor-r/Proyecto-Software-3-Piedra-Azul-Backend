# Perfil de producción (SPRING_PROFILES_ACTIVE=prod).
# A diferencia del perfil por defecto, aquí NO hay valores por defecto: si falta una
# variable de entorno, la aplicación no arranca en lugar de usar una clave débil.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origin=${FRONTEND_ORIGIN}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.agendador.email=${AGENDADOR_EMAIL}
app.agendador.password=${AGENDADOR_PASSWORD}
app.medico.email=${MEDICO_EMAIL}
app.medico.password=${MEDICO_PASSWORD}
app.terapista.email=${TERAPISTA_EMAIL}
app.terapista.password=${TERAPISTA_PASSWORD}
