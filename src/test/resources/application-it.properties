# Perfil de las pruebas de integración (*IT): PostgreSQL real.
# La base es exclusiva de las pruebas y se recrea en cada ejecución (create-drop):
# NUNCA apuntar IT_DB_URL a una base con datos reales.
spring.datasource.url=${IT_DB_URL:jdbc:postgresql://localhost:5432/piedrazul_it}
spring.datasource.username=${IT_DB_USERNAME:postgres}
spring.datasource.password=${IT_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin la siembra masiva de citas históricas: las pruebas parten de una agenda vacía
app.reportes.seed-enabled=false
